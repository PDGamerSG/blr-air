[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "blr-air"
version = "0.1.0"
description = "Find an outdoor window using live air quality, rain and heat forecasts."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["uagents==0.26.1", "httpx==0.28.1", "python-dotenv==1.2.1", "aiohttp==3.14.5"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.3"]

[project.scripts]
blr-air = "blr_air.cli:main"
blr-air-agent = "blr_air.agent_runtime:main"
blr-air-caller = "blr_air.caller:main"
blr-air-web = "blr_air.web:main"

[tool.setuptools.packages.find]
include = ["blr_air*"]

[tool.setuptools.package-data]
blr_air = ["AGENT_README.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
